<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>手持字幕 - 原型</title>
	<style>
		/* Reset & Base */
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			-webkit-tap-highlight-color: transparent;
		}

		body {
			background-color: #333;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			overflow: hidden;
		}

		.device-mockup {
			width: 375px;
			height: 812px;
			background: #F8F8F8;
			border-radius: 40px;
			position: relative;
			overflow: hidden;
			box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
			border: 8px solid #000;
		}

		/* Page Home */
		#page-home {
			display: flex;
			flex-direction: column;
			height: 100%;
			background-color: #F8F8F8;
		}

		.header {
			height: 60px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 20px;
			font-weight: bold;
			color: #101010;
			padding-top: 10px;
			/* Safe area top simulation */
		}

		.content-area {
			flex: 1;
			overflow-y: auto;
			padding: 0 20px 34px 20px;
		}

		/* 1. Preview */
		.preview-container {
			padding: 15px 0;
		}

		.preview-box {
			width: 100%;
			aspect-ratio: 21 / 9;
			background-color: #101010;
			border-radius: 16px;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
			position: relative;
		}

		.preview-text {
			color: #F8F8F8;
			font-size: 20px;
			/* dynamic */
			white-space: nowrap;
			height: 1em;
			line-height: 1;
			position: absolute;
		}

		/* 2. Text Input */
		.input-container {
			height: 90px;
			background: #FFFFFF;
			border: 1px solid #EBEBEB;
			border-radius: 5px;
			padding: 10px;
			margin-top: 5px;
			margin-bottom: 5px;
		}

		.input-container textarea {
			width: 100%;
			height: 100%;
			border: none;
			resize: none;
			outline: none;
			font-size: 16px;
			color: #101010;
		}

		.input-container textarea::placeholder {
			color: #999;
		}

		/* Dashed Divider */
		.dashed-divider {
			height: 1px;
			background-image: linear-gradient(to right, #EBEBEB 50%, transparent 50%);
			background-size: 4px 100%;
			margin: 10px 0;
		}

		/* Option Rows */
		.option-row {
			display: flex;
			align-items: center;
			height: 59px;
			padding: 13px 0;
		}

		.option-label {
			font-size: 18px;
			color: #101010;
			white-space: nowrap;
			margin-right: 10px;
		}

		.option-scroll {
			flex: 1;
			display: flex;
			overflow-x: auto;
			scroll-behavior: smooth;
			min-width: 0;
			/* 必须加 min-width: 0 以便允许 flex 容器内的滚动 */
			-webkit-overflow-scrolling: touch;
		}

		.option-scroll::-webkit-scrollbar {
			display: none;
		}

		.opt-btn {
			min-width: 70px;
			height: 33px;
			margin-right: 10px;
			border-radius: 10px;
			border: 1px solid rgba(187, 187, 187, 0.5);
			background: #FFF;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0 15px;
			font-size: 14px;
			font-weight: bold;
			color: #101010;
			flex-shrink: 0;
			cursor: pointer;
		}

		.opt-btn.selected {
			border: 1.5px solid rgba(16, 16, 16, 0.5);
		}

		/* Specific Colors logic */
		.color-btn {
			border: 1px solid rgba(187, 187, 187, 0.5);
		}

		.color-btn.selected {
			border-width: 1.5px;
		}

		/* Slider Row */
		.slider-row {
			display: flex;
			align-items: center;
			padding: 13px 0;
		}

		input[type=range] {
			flex: 1;
			-webkit-appearance: none;
			height: 3px;
			background: #E0E0E0;
			outline: none;
			border-radius: 2px;
		}

		input[type=range]::-webkit-slider-thumb {
			-webkit-appearance: none;
			appearance: none;
			width: 20px;
			height: 20px;
			border-radius: 50%;
			background: #101010;
			cursor: pointer;
		}

		/* Run Button */
		.run-button-container {
			padding: 0 20px 34px 20px;
		}

		.run-btn {
			width: 100%;
			height: 45px;
			background: #101010;
			color: #F8F8F8;
			border-radius: 10px;
			font-size: 18px;
			font-weight: bold;
			letter-spacing: 4px;
			border: 1px solid rgba(16, 16, 16, 0.5);
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			box-shadow: 0 5px 12px rgba(16, 16, 16, 0.28);
			transition: transform 0.11s cubic-bezier(0.215, 0.61, 0.355, 1), box-shadow 0.12s cubic-bezier(0.215, 0.61, 0.355, 1);
		}

		.run-btn:active {
			transform: scale(0.985);
			box-shadow: 0 2px 6px rgba(16, 16, 16, 0.16);
		}

		/* Page Run (Fullscreen mode simulation) */
		#page-run {
			display: none;
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: #101010;
			z-index: 10;
			/* Simulate landscape inside the portrait device */
			transform-origin: center center;
			width: 812px;
			height: 375px;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%) rotate(90deg);
		}

		.run-wrapper {
			position: relative;
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			overflow: hidden;
			cursor: pointer;
		}

		.run-text {
			color: #F8F8F8;
			white-space: nowrap;
			position: absolute;
			line-height: 1;
			animation: linear infinite;
		}

		/* Right Sheet Panel */
		.run-panel-overlay {
			display: none;
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(16, 16, 16, 0.54);
			z-index: 20;
		}

		.run-panel {
			position: absolute;
			right: -320px;
			top: 0;
			bottom: 0;
			width: 280px;
			background: #F8F8F8;
			border-radius: 24px 0 0 24px;
			border-left: 1px solid #E9E9E9;
			box-shadow: -6px 0 24px rgba(0, 0, 0, 0.16);
			transition: right 0.32s cubic-bezier(0.215, 0.61, 0.355, 1);
			padding: 16px;
			display: flex;
			flex-direction: column;
		}

		.panel-header {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			margin-bottom: 20px;
		}

		.panel-title {
			font-size: 20px;
			font-weight: 700;
			color: #101010;
			letter-spacing: 0.2px;
			margin-top: 4px;
		}

		.panel-close {
			width: 34px;
			height: 34px;
			border-radius: 50%;
			background: #FFF;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
		}

		.panel-close-icon {
			font-size: 18px;
			color: #101010;
			font-weight: bold;
		}

		.panel-actions {
			flex: 1;
			display: flex;
			flex-direction: column;
			justify-content: center;
		}

		.action-btn {
			height: 56px;
			border-radius: 28px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 18px;
			font-weight: 600;
			letter-spacing: 0.1px;
			cursor: pointer;
			border: none;
			outline: none;
		}

		.btn-primary {
			background: #101010;
			color: #FFF;
			border: 1px solid #101010;
		}

		.btn-danger {
			background: #FFF4F4;
			color: #FF4D4F;
			border: 1px solid #FFDCDD;
			margin-top: 28px;
		}

		/* Effects */
		@keyframes flash {

			0%,
			100% {
				opacity: 1;
			}

			50% {
				opacity: 0;
			}
		}

		.effect-flash {
			animation: flash 0.5s infinite alternate !important;
		}

		@keyframes shake {
			0% {
				transform: translate(0, 0);
			}

			20% {
				transform: translate(-2px, 2px);
			}

			40% {
				transform: translate(2px, -2px);
			}

			60% {
				transform: translate(-2px, -2px);
			}

			80% {
				transform: translate(2px, 2px);
			}

			100% {
				transform: translate(0, 0);
			}
		}

		.effect-shake {
			animation: shake 0.3s infinite !important;
		}

		/* Marquee Animation */
		@keyframes marquee {
			from {
				left: 0;
				transform: translateX(var(--start-x, 100vw));
			}

			to {
				left: 0;
				transform: translateX(-100%);
			}
		}
	</style>
</head>

<body>

	<div class="device-mockup">
		<!-- HOMEPAGE -->
		<div id="page-home">
			<div class="header">手持字幕</div>
			<div class="content-area">
				<!-- Preview -->
				<div class="preview-container">
					<div class="preview-box" id="preview-box">
						<div class="preview-text" id="preview-text">输入字幕... ...</div>
					</div>
				</div>

				<!-- Input -->
				<div class="input-container">
					<textarea id="text-input" placeholder="输入字幕... ..."></textarea>
				</div>
				<div class="dashed-divider"></div>

				<!-- Colors -->
				<div class="option-row">
					<div class="option-scroll" id="color-options">
						<!-- JS 渲染 -->
					</div>
				</div>
				<div class="dashed-divider"></div>

				<!-- Fonts -->
				<div class="option-row">
					<div class="option-label">字&nbsp;&nbsp;体：</div>
					<div class="option-scroll" id="font-options">
						<!-- JS 渲染 -->
					</div>
				</div>
				<div class="dashed-divider"></div>

				<!-- Sizes -->
				<div class="option-row">
					<div class="option-label">大&nbsp;&nbsp;小：</div>
					<div class="option-scroll" id="size-options">
						<!-- JS 渲染 -->
					</div>
				</div>
				<div class="dashed-divider"></div>

				<!-- Speed -->
				<div class="slider-row">
					<div class="option-label">速&nbsp;&nbsp;度：</div>
					<input type="range" id="speed-input" min="0.5" max="5.0" step="0.1" value="2.0">
				</div>
			</div>

			<!-- Run Button -->
			<div class="run-button-container">
				<div class="run-btn" id="run-btn">运&nbsp;&nbsp;行</div>
			</div>
		</div>

		<!-- RUN PAGE -->
		<div id="page-run">
			<div class="run-wrapper" id="run-wrapper">
				<div class="run-text" id="run-text">输入字幕... ...</div>
			</div>

			<div class="run-panel-overlay" id="run-panel-overlay">
				<div class="run-panel" id="run-panel">
					<div class="panel-header">
						<div class="panel-title">操作面板</div>
						<div class="panel-close" id="panel-close">
							<span class="panel-close-icon">✕</span>
						</div>
					</div>
					<div class="panel-actions">
						<button class="action-btn btn-primary" id="btn-edit">
							修改样式
						</button>
						<button class="action-btn btn-danger" id="btn-exit">
							退出程序
						</button>
					</div>
				</div>
			</div>
		</div>

	</div>

	<script>
		// State
		let state = {
			text: '',
			colorIndex: 0,
			fontIndex: 0,
			sizeIndex: 1,
			speed: 2.0
		};

		const colors = [
			{ bg: '#101010', text: '#F8F8F8', name: '黑底白字' },
			{ bg: '#101010', text: '#FF4D4F', name: '黑底红字' },
			{ bg: '#101010', text: '#00FF29', name: '黑底绿字' },
			{ bg: '#000A7B', text: '#F8F8F8', name: '蓝底白字' },
			{ bg: '#101010', name: '闪烁效果' },
			{ bg: '#101010', name: '抖动效果' },
		];

		const fonts = [
			{ label: '默认', family: 'sans-serif' },
			{ label: '方正·简', family: 'serif' },
			{ label: '卡通', family: 'cursive' },
			{ label: '得意黑', family: 'fantasy' },
		];

		const sizes = [
			{ label: '较小', value: 0.45 },
			{ label: '适中', value: 0.60 },
			{ label: '较大', value: 0.75 },
			{ label: '全屏', value: 1.00 },
		];

		// DOM Elements
		const textInput = document.getElementById('text-input');
		const previewBox = document.getElementById('preview-box');
		const previewText = document.getElementById('preview-text');

		const colorOptionsEl = document.getElementById('color-options');
		const fontOptionsEl = document.getElementById('font-options');
		const sizeOptionsEl = document.getElementById('size-options');
		const speedInput = document.getElementById('speed-input');

		const runBtn = document.getElementById('run-btn');
		const pageHome = document.getElementById('page-home');
		const pageRun = document.getElementById('page-run');
		const runWrapper = document.getElementById('run-wrapper');
		const runText = document.getElementById('run-text');

		const runPanelOverlay = document.getElementById('run-panel-overlay');
		const runPanel = document.getElementById('run-panel');
		const panelClose = document.getElementById('panel-close');
		const btnEdit = document.getElementById('btn-edit');
		const btnExit = document.getElementById('btn-exit');

		// Initialization
		function init() {
			renderColors();
			renderFonts();
			renderSizes();
			bindEvents();
			enableDragScroll();
			updatePreview();
		}

		function enableDragScroll() {
			const scrolls = document.querySelectorAll('.option-scroll');
			scrolls.forEach(slider => {
				let isDown = false;
				let startX;
				let scrollLeft;

				slider.addEventListener('mousedown', (e) => {
					isDown = true;
					slider.style.cursor = 'grabbing';
					startX = e.pageX - slider.offsetLeft;
					scrollLeft = slider.scrollLeft;
				});
				slider.addEventListener('mouseleave', () => {
					isDown = false;
					slider.style.cursor = '';
				});
				slider.addEventListener('mouseup', () => {
					isDown = false;
					slider.style.cursor = '';
				});
				slider.addEventListener('mousemove', (e) => {
					if (!isDown) return;
					e.preventDefault();
					const x = e.pageX - slider.offsetLeft;
					const walk = (x - startX) * 1.5; // 滑动灵敏度
					slider.scrollLeft = scrollLeft - walk;
				});
			});
		}

		function renderColors() {
			colorOptionsEl.innerHTML = '';
			colors.forEach((c, idx) => {
				const btn = document.createElement('div');
				btn.className = 'opt-btn color-btn' + (state.colorIndex === idx ? ' selected' : '');
				btn.style.backgroundColor = c.bg;
				btn.style.borderColor = state.colorIndex === idx ? c.bg : '#BBBBBB80';
				if (c.name === '闪烁效果' || c.name === '抖动效果') {
					btn.style.color = '#FFF'; // 假设默认白色
				} else {
					btn.style.color = c.text;
				}
				btn.innerText = c.name;
				btn.onclick = () => {
					state.colorIndex = idx;
					renderColors();
					updatePreview();
				};
				colorOptionsEl.appendChild(btn);
			});
		}

		function renderFonts() {
			fontOptionsEl.innerHTML = '';
			fonts.forEach((f, idx) => {
				const btn = document.createElement('div');
				btn.className = 'opt-btn' + (state.fontIndex === idx ? ' selected' : '');
				btn.innerText = f.label;
				btn.onclick = () => {
					state.fontIndex = idx;
					renderFonts();
					updatePreview();
				};
				fontOptionsEl.appendChild(btn);
			});
		}

		function renderSizes() {
			sizeOptionsEl.innerHTML = '';
			sizes.forEach((s, idx) => {
				const btn = document.createElement('div');
				btn.className = 'opt-btn' + (state.sizeIndex === idx ? ' selected' : '');
				btn.innerText = s.label;
				btn.onclick = () => {
					state.sizeIndex = idx;
					renderSizes();
					updatePreview();
				};
				sizeOptionsEl.appendChild(btn);
			});
		}

		function bindEvents() {
			textInput.addEventListener('input', (e) => {
				state.text = e.target.value;
				updatePreview();
			});

			speedInput.addEventListener('input', (e) => {
				state.speed = parseFloat(e.target.value);
				updatePreview();
			});

			runBtn.addEventListener('click', () => {
				startRun();
			});

			runWrapper.addEventListener('click', () => {
				showPanel();
			});

			panelClose.addEventListener('click', hidePanel);
			runPanelOverlay.addEventListener('click', (e) => {
				if (e.target === runPanelOverlay) hidePanel();
			});

			btnEdit.addEventListener('click', () => {
				hidePanel();
				stopRun();
			});

			btnExit.addEventListener('click', () => {
				hidePanel();
				stopRun();
			});
		}

		function updatePreview() {
			const textToShow = state.text || "输入字幕... ...";
			previewText.innerText = textToShow;

			// Apply styling
			const c = colors[state.colorIndex];
			previewBox.style.backgroundColor = c.bg;
			previewText.style.color = c.text || '#F8F8F8';

			const f = fonts[state.fontIndex];
			previewText.style.fontFamily = f.family;

			const s = sizes[state.sizeIndex];
			// calc height of box to set font size properly. Box width 335, ratio 21/9 -> height = 335 / (21/9) ≈ 143.5
			// fontSize = boxHeight * s.value
			const boxHeight = (375 - 40) / (21 / 9);
			previewText.style.fontSize = (boxHeight * s.value) + 'px';

			// effects styling
			previewText.className = 'preview-text';
			if (c.name === '闪烁效果') previewText.classList.add('effect-flash');
			if (c.name === '抖动效果') previewText.classList.add('effect-shake');

			const boxWidth = previewBox.offsetWidth || (375 - 40);

			// Temporarily stop animation to accurately calculate width
			previewText.style.animation = 'none';
			const textWidth = previewText.offsetWidth;

			// velocity: speed * 60 px/sec. Calculate correct run duration
			const velocity = state.speed * 60;
			const duration = (boxWidth + textWidth) / velocity;

			previewText.style.setProperty('--start-x', boxWidth + 'px');

			// Force reflow to immediately restart animation from the very beginning
			void previewText.offsetWidth;
			previewText.style.animation = `marquee ${duration}s linear infinite`;
		}

		function startRun() {
			pageHome.style.display = 'none';
			pageRun.style.display = 'block';

			const textToShow = state.text || "输入字幕... ...";
			runText.innerText = textToShow;

			const c = colors[state.colorIndex];
			pageRun.style.backgroundColor = c.bg;
			runText.style.color = c.text || '#F8F8F8';

			const f = fonts[state.fontIndex];
			runText.style.fontFamily = f.family;

			const s = sizes[state.sizeIndex];
			// In run mode, it is landscape, height = 375.
			const screenHeight = 375;
			runText.style.fontSize = (screenHeight * s.value) + 'px';

			runText.className = 'run-text';
			if (c.name === '闪烁效果') runText.classList.add('effect-flash');
			if (c.name === '抖动效果') runText.classList.add('effect-shake');

			const screenWidth = 812; // mock landscape width
			runText.style.animation = 'none';
			const textWidth = runText.offsetWidth;

			const velocity = state.speed * 60;
			const duration = (screenWidth + textWidth) / velocity;

			runText.style.setProperty('--start-x', screenWidth + 'px');
			void runText.offsetWidth; // Force reflow
			runText.style.animation = `marquee ${duration}s linear infinite`;
		}

		function stopRun() {
			pageRun.style.display = 'none';
			pageHome.style.display = 'flex';
		}

		function showPanel() {
			runPanelOverlay.style.display = 'block';
			setTimeout(() => {
				runPanel.style.right = '0';
			}, 10);
		}

		function hidePanel() {
			runPanel.style.right = '-320px';
			setTimeout(() => {
				runPanelOverlay.style.display = 'none';
			}, 300);
		}

		init();
	</script>
</body>

</html>
